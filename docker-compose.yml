name: saas-tenant-api

services:
  app:
    container_name: saas-app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - ./src:/var/www
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "php -v > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    container_name: saas-nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./src:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  # No container_name: a fixed name would block `docker compose up --scale worker=N`.
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --max-time=3600
    volumes:
      - ./src:/var/www
    depends_on:
      app:
        condition: service_healthy

  # Runs the schedule in routes/console.php every minute; queued entries are executed by the worker.
  # A single instance: a second scheduler would run every entry twice.
  scheduler:
    container_name: saas-scheduler
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - ./src:/var/www
    depends_on:
      app:
        condition: service_healthy

  # One-shot: installs dependencies, migrates, and seeds idempotently, then exits.
  # Invoked via sh so it runs regardless of the file's executable bit on Windows checkouts.
  setup:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: "no"
    command: ["sh", "/usr/local/bin/setup.sh"]
    environment:
      APP_PORT: ${APP_PORT:-8000}
    volumes:
      - ./src:/var/www
      - ./docker/php/setup.sh:/usr/local/bin/setup.sh:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    container_name: saas-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: UTC
    # Credentials come from src/.env (falling back to .env.example before setup has created it).
    entrypoint:
      - sh
      - -c
      - |
        set -a
        eval "$$(grep -h '^DB_' /laravel/.env.example /laravel/.env 2>/dev/null)"
        POSTGRES_DB=$$DB_DATABASE POSTGRES_USER=$$DB_USERNAME POSTGRES_PASSWORD=$$DB_PASSWORD
        exec docker-entrypoint.sh postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src:/laravel:ro
      # Runs only when the volume is first initialised; Pest runs against this database, never the seeded one.
      - ./docker/postgres/create-testing-database.sh:/docker-entrypoint-initdb.d/create-testing-database.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - eval "$$(grep -h '^DB_' /laravel/.env.example /laravel/.env 2>/dev/null)" && pg_isready -h 127.0.0.1 -U "$$DB_USERNAME" -d "$$DB_DATABASE"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    container_name: saas-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
